# Run self-hosted Renovate so dependency PRs can refresh generated lock values.
name: renovate.yml

# This workflow can be run manually and also runs daily.
# - Daily runs let vulnerability-fix PRs open within a day; routine updates
#   still wait for the monthly `schedule` in `.github/renovate.json`.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

# The default token only needs read access because Renovate uses a GitHub App
# token with narrower, explicit permissions for repository changes.
permissions:
  contents: read

jobs:
  renovate:
    name: update-dependencies
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Mint a short-lived GitHub App token so Renovate can open PRs and update
      # the files allowed by `.github/renovate.json` without storing a broad
      # personal access token.
      - name: Create Renovate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-statuses: write
          permission-contents: write
          permission-pull-requests: write
          # Renovate now owns GitHub Actions updates, and GitHub only lets an
          # app edit `.github/workflows/*` with this permission.
          permission-workflows: write
          # Read Dependabot alerts so Renovate can open vulnerability-fix PRs
          # that skip the schedule and cooldown.
          permission-vulnerability-alerts: read
          permission-administration: read
          permission-metadata: read
      # make renovate keeps Renovate execution inside the repository's normal
      # container-first Makefile interface.
      - name: Run Renovate dependency updates
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_REPOSITORY: ${{ github.repository }}
        run: PROJECT_CFG_FILE=config/project.cfg make renovate
