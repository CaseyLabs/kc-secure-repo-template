# Scan the checked-in tree for secrets and workflow policy issues.
name: scan.yml

# Run security checks on main and on pull requests so the same check can protect
# the default branch.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Security scans only need repository read access.
permissions:
  contents: read

# Cancel older scan runs for the same branch or PR when a newer commit appears.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan-repo
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 preserves full history so betterleaks can scan commits, not
      # just files in the current checkout.
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Buildx enables Docker layer cache export/import for the scan image.
      - name: Set up Docker build cache
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # docker buildx reads the Actions cache token and URLs from the
      # environment, but GitHub only passes them to actions, not to `run:`
      # steps. Export only the cache variables (not every ACTIONS_* value) so
      # the type=gha cache in DOCKER_BUILD_EXTRA_ARGS can import and export
      # layers. Without this step Buildx silently skips the cache.
      - name: Expose Actions cache to Docker Buildx
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL', 'ACTIONS_CACHE_SERVICE_V2']) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }
      - name: Run secret and workflow scans
        env:
          # scripts/scan.sh reads this variable and passes it to docker buildx.
          DOCKER_BUILD_EXTRA_ARGS: --cache-from type=gha,scope=project-image --cache-to type=gha,scope=project-image,mode=max
          # The commit attribution check rechecks this range (PR commits, or the
          # commits a push added). Commit SHAs go through env, never directly into
          # `run`; an unknown base makes the check cover the head's full history.
          COMMIT_POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_POLICY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: PROJECT_CFG_FILE=config/project.cfg make scan
