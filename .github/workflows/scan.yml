# Scan the checked-in tree for secrets and workflow policy issues.
name: scan.yml

# Run security checks on main and on pull requests so the same check can protect
# the default branch.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Security scans only need repository read access.
permissions:
  contents: read

# Cancel older scan runs for the same branch or PR when a newer commit appears.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan-repo
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 preserves full history so betterleaks can scan commits, not
      # just files in the current checkout.
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run secret and workflow scans
        env:
          # The commit attribution check rechecks this range (PR commits, or the
          # commits a push added). Commit SHAs go through env, never directly into
          # `run`; an unknown base makes the check cover the head's full history.
          COMMIT_POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_POLICY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: PROJECT_CFG_FILE=config/project.cfg make scan
