# Run the template's test path and generated-repo smoke validation.
name: test.yml

# Run tests on main and on pull requests so protected branches can require the
# same checks before merge.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# The tests only need to read repository contents.
permissions:
  contents: read

# Cancel older runs for the same branch or PR when a newer commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-test-changes:
    name: detect-test-changes
    runs-on: ubuntu-24.04
    outputs:
      test_code: ${{ steps.changes.outputs.test_code }}
      test_repo: ${{ steps.changes.outputs.test_repo }}
    steps:
      # The detector is intentionally a tiny shell script, not a path-filtered
      # workflow. Required checks stay reportable, and skipped test jobs are
      # marked successful instead of pending.
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Pull request detection compares the synthetic merge commit parents.
          fetch-depth: 2
          persist-credentials: false
      - name: Detect changed test surfaces
        id: changes
        run: sh scripts/ci-changes.sh

  test-src:
    # Required check: validates the checked-in src/ workspace.
    name: test-code
    needs: detect-test-changes
    if: ${{ always() && (needs.detect-test-changes.result != 'success' || needs.detect-test-changes.outputs.test_code == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful change detection
        if: ${{ needs.detect-test-changes.result != 'success' }}
        run: |
          printf 'detect-test-changes did not complete successfully\n' >&2
          exit 1
      # Checkout keeps credentials out of the local Git config after the step.
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Buildx enables GitHub Actions cache import/export for Docker layers.
      - name: Set up Docker build cache
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Run source tests and build
        env:
          # scripts/build.sh reads this variable and passes it to docker buildx.
          DOCKER_BUILD_EXTRA_ARGS: --cache-from type=gha,scope=src-image --cache-to type=gha,scope=src-image,mode=max
        run: PROJECT_CFG_FILE=config/project.cfg make test

  test-smoke:
    # Required check: copies the template into fresh directories and validates
    # that a generated repository can still build and scan.
    name: test-repo
    needs: detect-test-changes
    if: ${{ always() && (needs.detect-test-changes.result != 'success' || needs.detect-test-changes.outputs.test_repo == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful change detection
        if: ${{ needs.detect-test-changes.result != 'success' }}
        run: |
          printf 'detect-test-changes did not complete successfully\n' >&2
          exit 1
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # TEST_MODE=smoke selects the generated-repo smoke path in scripts/test.sh.
      - name: Run generated repository smoke test
        run: PROJECT_CFG_FILE=config/project.cfg TEST_MODE=smoke make test
