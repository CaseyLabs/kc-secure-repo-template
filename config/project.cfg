# --- Project Configuration ---
# - Do not store any sensitive values/credentials in this file.

PROJECT_NAME='kc-secure-template'
PROJECT_IMAGE="${PROJECT_NAME}:local"

# Optional: Renovate upgrader tool
# --------------------------------
# - Self-hosted Renovate can automatically update the versions in `project.cfg` by creating GitHub pull requests
DEV_SCAN_ENABLE_RENOVATE=true
# renovate: datasource=docker depName=renovate/renovate versioning=docker
DEV_RENOVATE_IMAGE='renovate/renovate:43.195.4'

# Project base image
# ------------------
PROJECT_DOCKERFILE='Dockerfile'
DEV_BASE_IMAGE='debian:trixie-slim'

# renovate: datasource=docker depName=golang versioning=docker
DEV_GO_IMAGE='golang:1.26.3-trixie'

# Optional: distroless runtime image
# ----------------------------------
# - Opt-in. Set `PROJECT_RUNTIME_IMAGE` to a local image tag and `make build` also
#   builds the Dockerfile `runtime` stage: the example binary on a minimal,
#   shell-less, non-root distroless base. Leave it blank (the default) to skip.
# - The `:nonroot` tag stays here on purpose; `make update` and Renovate refresh
#   the digest in `config/lockfile.cfg`. A blank selector skips locking, and then
#   `make build` refuses to build the runtime image.
PROJECT_RUNTIME_IMAGE=''
# renovate: datasource=docker depName=gcr.io/distroless/static-debian13 versioning=docker
DEV_DISTROLESS_STATIC_IMAGE='gcr.io/distroless/static-debian13:nonroot'

# Optional: image vulnerability scan
# ----------------------------------
# - Opt-in. Set `PROJECT_SCAN_IMAGE_VULNS=true` and `make scan` also builds
#   `PROJECT_SCAN_IMAGE_TARGET` (default `runtime`), saves it to a temporary tarball,
#   and fails on HIGH or CRITICAL findings from the pinned Trivy image.
# - Any target other than `dev` needs digest-pinned `DEV_GO_IMAGE_LOCK` and
#   `DEV_DISTROLESS_STATIC_IMAGE_LOCK`; every target is built with them.
# - This scan needs network access to fetch Trivy's vulnerability database.
# - Leave the target on a shipped-image stage; the dev image carries toolchains on purpose.
PROJECT_SCAN_IMAGE_VULNS=false
PROJECT_SCAN_IMAGE_TARGET='runtime'

# Workflow commands
# -----------------
# - `make build`, `make test`, and `make run` run these with `sh -eu -c` inside
#   the existing non-root dev container, from the repository root at `/workspace`.
# - The defaults are the bundled Go example. Override them in a layered config
#   (or here) when `src/` uses another stack, and make sure the dev image has
#   that stack's toolchain.
# - A build, lint, or test command that exits non-zero fails the make target;
#   there is no fallback. An empty value turns that step into a no-op.
#   `make run` starts its command detached, so check
#   `make status` or `make logs` for run failures.
PROJECT_BUILD_COMMAND='cd src && go build -trimpath -buildvcs=false ./cmd/app'
# Lint runs before tests in `make test`.
PROJECT_LINT_COMMAND='cd src && test -z "$(gofmt -l .)" && go vet ./...'
PROJECT_TEST_COMMAND='cd src && go test -v ./... && go build -trimpath -buildvcs=false ./cmd/app'
# `make run` starts this detached in a container named after the project.
PROJECT_RUN_COMMAND='cd src && go run ./cmd/app'

# Security scanners
# -----------------
# Betterleaks is the maintained successor to gitleaks from the same original
# author. It reads gitleaks configs and keeps the git/dir scan commands.
# renovate: datasource=docker depName=ghcr.io/betterleaks/betterleaks versioning=docker
DEV_SCAN_BETTERLEAKS_IMAGE='ghcr.io/betterleaks/betterleaks:v1.9.0'

# renovate: datasource=docker depName=rhysd/actionlint versioning=docker
DEV_SCAN_ACTIONLINT_IMAGE='rhysd/actionlint:1.7.12'

# renovate: datasource=docker depName=ghcr.io/zizmorcore/zizmor versioning=docker
DEV_SCAN_ZIZMOR_IMAGE='ghcr.io/zizmorcore/zizmor:1.24.1'

# renovate: datasource=docker depName=aquasec/trivy versioning=docker
DEV_SCAN_TRIVY_IMAGE='aquasec/trivy:0.76.0'

# renovate: datasource=docker depName=anchore/syft versioning=docker
DEV_SCAN_SYFT_IMAGE='anchore/syft:v1.54.1'

# renovate: datasource=docker depName=anchore/grype versioning=docker
DEV_SCAN_GRYPE_IMAGE='anchore/grype:v0.120.1'

# Optional Terraform settings
# ---------------------------
# renovate: datasource=docker depName=hashicorp/terraform versioning=docker
DEV_TERRAFORM_IMAGE='hashicorp/terraform:1.16.6'

# renovate: datasource=terraform-provider depName=integrations/github versioning=hashicorp
DEV_TERRAFORM_GITHUB_PROVIDER_VERSION='6.13.0'

# Optional Kubernetes settings
# ----------------------------
K8S_RELEASE_NAME=''
K8S_NAME_OVERRIDE=''

# - Leave these blank to follow `PROJECT_IMAGE` automatically, including in
#   layered configs that source this file and then override `PROJECT_NAME` or
#   `PROJECT_IMAGE`
# - In a real cluster this usually points at a registry path like:
#   `ghcr.io/org/app` plus a release tag
K8S_IMAGE_REPOSITORY=''
K8S_IMAGE_TAG=''

# Namespace is the Kubernetes "folder" these resources belong to in a cluster.
# - `make k8s` only renders with this value; it does not create the namespace.
K8S_NAMESPACE='default'

# A Helm chart is a package of Kubernetes YAML templates that can be rendered for a specific deployment
K8S_CHART_PATH='config/k8s/chart'
# renovate: datasource=docker depName=alpine/helm versioning=docker
DEV_K8S_HELM_IMAGE='alpine/helm:4.3.1'
# Versioned tags give Renovate real release dates for the 7-day cooldown; a
# rolling :latest tag is rebuilt too often to ever clear it.
# renovate: datasource=docker depName=alpine/kubectl versioning=docker
DEV_K8S_KUBECTL_IMAGE='alpine/kubectl:1.37.0'

# Optional extra values file for environment-specific overrides.
# - In Helm, values files are the usual way to change ports, ingress hosts, resources, and similar deployment settings without editing the templates themselves
K8S_VALUES_FILE=''

# AI agent guidance budget
# ------------------------
# - `make scan` fails when the root `AGENTS.md` grows past these limits
# - Codex and Claude Code load the whole root `AGENTS.md` into every session, and Codex stops
#   reading project docs at 32 KiB by default, so keep task procedures in skills or docs instead
# - Raise the limits deliberately in a derived repository if its durable rules need more room
AGENT_GUIDANCE_MAX_LINES=150
AGENT_GUIDANCE_MAX_BYTES=12288

# SHA Checksum Lockfile
# ---------------------
# (The lockfile is updated via `make update`)
. ./config/lockfile.cfg
